name: EA1 - Ingestión de Datos desde API

# Disparadores del workflow:
# - push: se ejecuta automáticamente en cada push al repositorio.
# - workflow_dispatch: permite ejecutarlo manualmente desde la pestaña Actions.
# - schedule: ejecución programada diaria (opcional), útil para demostrar
#   que la ingesta se puede repetir automáticamente en el tiempo.
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # todos los días a las 06:00 UTC

jobs:
  ingest:
    name: Ejecutar pipeline de ingestión
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Ejecutar pruebas
        run: pytest -v

      - name: 5. Ejecutar el pipeline de ingestión
        run: python src/main.py

      - name: 6. Verificar que existan los archivos generados
        run: |
          test -f data/database/games.db
          test -f output/games_sample.csv
          test -f output/audit_report.txt
          echo "Todos los archivos esperados fueron generados correctamente."

      - name: 7. Mostrar información de los archivos generados
        run: |
          echo "== data/database/games.db =="
          ls -lh data/database/games.db
          echo ""
          echo "== output/games_sample.csv (primeras líneas) =="
          head -n 5 output/games_sample.csv
          echo ""
          echo "== output/audit_report.txt =="
          cat output/audit_report.txt

      - name: 8. Publicar archivos generados como artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-ingestion-ea1
          path: |
            data/raw/games.json
            data/database/games.db
            output/games_sample.csv
            output/audit_report.txt
          if-no-files-found: error
          retention-days: 30
